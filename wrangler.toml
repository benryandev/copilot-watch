name = "copilot-watch"
main = "src/worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "KV"
id = "22fd6ef1fa074edea7689bdaa2b5378f"

# The multiplayer room, for telling everyone about a new #1 lap (src/race.js announceRecord)
[[services]]
binding = "WORLD"
service = "copilot-world"

# Workers Logs (6 Nov 2026): keeps the worker's own console lines for 3 days, so a rejected lap's reason can be read
# after the fact (SellOuT's Lagoon lap was refused with no live tail running). Only those lines: no per-request
# invocation records (request metadata, and most of the volume). The lines hold counts, error names, lap times and
# posted names, never addresses, chat ids or tokens.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = false

[triggers]
crons = ["*/2 * * * *", "0 22 * * *"]

[vars]
DISCORD_APP_ID = "1561719393992319007"
DISCORD_PUBLIC_KEY = "50e537c588ad61fa8b38b6ced330efecd368c0c74f351ea710808beba8d6cb48"

# Per-chat command limit (Workers rate limiting binding; KV counters race under bursts)
[[ratelimits]]
name = "CMD_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
